<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지자체 협력사업 신청 현황</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#14213d;--sub:#5b6577;--line:#d9dee6;--ok:#1b7f4b;--okbg:#e4f4ea;--no:#b3261e;--nobg:#fbe7e5}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--card:#182030;--ink:#e8ecf4;--sub:#9aa5b8;--line:#2a3448;--ok:#5fd394;--okbg:#14382a;--no:#ff8a80;--nobg:#421a17}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "IBM Plex Sans KR",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 56px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:18px;margin:36px 0 12px}
.sub{color:var(--sub);margin:0 0 20px}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.sum span{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:16px}
.card.ok{--c:var(--ok)}.card.no{--c:var(--no)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-weight:700}
.badge{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;color:var(--c);background:var(--bg2)}
.ok .badge{--bg2:var(--okbg)}.no .badge{--bg2:var(--nobg)}
.biz{margin:8px 0 12px;font-size:15px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px}
dt{color:var(--sub)}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.over{color:var(--no);font-weight:700}
.frame{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
iframe{display:block;width:100%;height:520px;border:0}
.guide{padding:18px;font-size:14px;color:var(--sub)}
.guide code{background:var(--bg);padding:1px 6px;border-radius:4px;color:var(--ink)}
.err{padding:16px;border:1px solid var(--no);border-radius:8px;color:var(--no)}
</style>
</head>
<body>
<div class="wrap">
  <h1>지자체 협력사업 신청 현황</h1>
  <p class="sub">신청액이 예산 한도를 넘으면 반려(빨강), 이내이면 승인(초록)으로 표시합니다. 금액 단위: 천원</p>
  <div class="sum" id="sum"></div>
  <div class="grid" id="grid" aria-live="polite">불러오는 중…</div>

  <h2>신청 자료 (Google Sheets) — 지자체 · 사업명 · 예산</h2>
  <div class="frame">
    <iframe id="sheet" title="지자체 협력사업 신청 자료" loading="lazy"
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSWrzou2g-CdfWrPIvdK9TJf2_UScCnrckzuWRkquE4P5PgHFls43_JZC9gJbIMzY3UqJ2d1yrRlceH/pubhtml?widget=true&amp;headers=false"></iframe>
    <div class="guide" id="guide" hidden>
      Google Sheets 임베드 주소가 아직 설정되지 않았습니다. 시트에서 <code>파일 → 공유 → 웹에 게시 → 임베드</code>로 받은 <code>src</code> 주소를
      <code>index.html</code>의 <code>iframe</code>에 넣어 주세요.
    </div>
  </div>
</div>
<script>
var FALLBACK=[{"지자체명":"가람군","인구수":30000,"신청액":250000,"예산":250000,"사업명":"가람군 청년 농촌 정착 지원 사업"},{"지자체명":"나봄시","인구수":45000,"신청액":500000,"예산":500000,"사업명":"나봄시 스마트 관광 플랫폼 구축"},{"지자체명":"다솔구","인구수":80000,"신청액":600000,"예산":600000,"사업명":"다솔구 어르신 디지털 친화 도시 조성"},{"지자체명":"라윤시","인구수":60000,"신청액":700000,"예산":700000,"사업명":"라윤시 도심 보행자 안전망 구축"},{"지자체명":"마을군","인구수":25000,"신청액":200000,"예산":200000,"사업명":"마을군 지역화폐 활성화 사업"},{"지자체명":"바람시","인구수":100000,"신청액":950000,"예산":950000,"사업명":"바람시 친환경 에너지 전환 사업"},{"지자체명":"사계구","인구수":55000,"신청액":600000,"예산":600000,"사업명":"사계구 청소년 안심 귀가 시스템"},{"지자체명":"아현시","인구수":70000,"신청액":650000,"예산":650000,"사업명":"아현시 도시재생 거점공간 조성"},{"지자체명":"자연군","인구수":40000,"신청액":380000,"예산":380000,"사업명":"자연군 생태관광 마을 조성"},{"지자체명":"차돌시","인구수":90000,"신청액":880000,"예산":880000,"사업명":"차돌시 산업단지 디지털 전환 사업"}];
var n=function(v){return Number(v).toLocaleString("ko-KR")};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function render(list){
  var ok=0,no=0,total=0;
  document.getElementById("grid").innerHTML=list.map(function(r){
    var over=r["신청액"]>r["예산"]; over?no++:ok++; total+=r["신청액"];
    return '<article class="card '+(over?'no':'ok')+'"><div class="top"><span class="name">'+esc(r["지자체명"])+
      '</span><span class="badge">'+(over?'반려':'승인')+'</span></div><p class="biz">'+esc(r["사업명"])+
      '</p><dl><dt>인구수</dt><dd>'+n(r["인구수"])+'명</dd><dt>신청액</dt><dd class="'+(over?'over':'')+'">'+n(r["신청액"])+
      '</dd><dt>예산</dt><dd>'+n(r["예산"])+'</dd></dl></article>';
  }).join("");
  document.getElementById("sum").innerHTML='<span>전체 '+list.length+'건</span><span>승인 '+ok+'건</span><span>반려 '+no+'건</span><span>신청액 합계 '+n(total)+'</span>';
}
fetch("신청목록.json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(render).catch(function(){render(FALLBACK)});
var s=document.getElementById("sheet");
if(s.getAttribute("src").indexOf("YOUR_PUBLISH_ID")>-1){s.style.display="none";document.getElementById("guide").hidden=false}
</script>
</body>
</html>
